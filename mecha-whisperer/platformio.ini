; PlatformIO Project Configuration File for MECHA-WHISPERER
; Waveshare ESP32-S3-Touch-AMOLED-1.8

[platformio]
default_envs = esp32-s3-touch-amoled

[env:esp32-s3-touch-amoled]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial & Upload Configuration
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3 Flash & PSRAM Settings (16MB Flash, 8MB Octal PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    ; Include Bundled Waveshare Driver Libraries
    -I../waveshare-repo/examples/arduino/libraries/GFX_Library_for_Arduino/src
    -I../waveshare-repo/examples/arduino/libraries/Arduino_DriveBus/src
    -I../waveshare-repo/examples/arduino/libraries/SensorLib/src
    -I../waveshare-repo/examples/arduino/libraries/XPowersLib/src
    -I../waveshare-repo/examples/arduino/libraries/Adafruit_XCA9554
    -I../waveshare-repo/examples/arduino/libraries/Adafruit_BusIO
    -I../waveshare-repo/examples/arduino/libraries/Mylibrary

lib_deps =
    Wire
    SPI
    FS
